name: Bug report
description: Report reproducible incorrect behavior in FileOrganizer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real user paths, private file names, configuration data, or journal contents.
        Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: FileOrganizer version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Use an isolated temporary-directory example with redacted names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I reproduced this only in an isolated temporary directory.
          required: true
        - label: I removed personal paths, file names, and configuration data.
          required: true
